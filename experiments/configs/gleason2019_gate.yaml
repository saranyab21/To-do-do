# Pillar-1 competence and grounding gate on Gleason2019 (see src/evaluation/gate.py).
# One forward pass per (core, query dimension, image condition, question wording).
run_name: gate_v1
model_config: experiments/configs/gleason2019_zeroshot.yaml   # model, quant, system + context
labels_config: experiments/configs/gleason2019_labels.yaml    # min_pattern_frac
size: 448                     # image encoder signal does not depend on size (probe_v2)
conditions: [real, shuffled, blank, hard_negative]
blank_rgb: [242, 242, 242]    # empty glass
seed: 20261126                # shuffle partners (always a core from another slide) and bootstrap
n_boot: 2000
min_effect_nats: 0.01      # G1, G3, G4 must beat zero by this margin (95% interval)

# Hard-negative image for G4 (added after gate_v1, before any fine-tuned model): the core
# from another slide that looks most similar to the frozen vision encoder (cosine on
# standardised img_L0 features) but whose pathologists' majority grade group differs.
hard_negative:
  features: data/processed/gleason2019/features/probe_v1/features_448.npz
  feature: img_L0
  differ_on: grade_group

# Query dimensions, each answered with one digit. primary/secondary reuse the zero-shot
# wording from model_config, so their "real" scores reproduce zeroshot_v1 at 448 px.
# paraphrases: two meaning-preserving rewordings (added after gate_v1) for the G3
# paraphrase control; they are scored on the real image only.
dimensions:
  cancer:
    codes: [0, 1]
    question: >-
      Does this core contain prostate cancer (any Gleason pattern 3, 4 or 5)? Answer with a
      single digit: 1 if cancer is present, 0 if the core is benign.
    paraphrases:
      - >-
        Is any prostate adenocarcinoma (Gleason pattern 3, 4 or 5) present in this tissue
        core? Reply with one digit: 1 for yes (cancer present), 0 for no (benign).
      - >-
        Classify this core as benign or malignant. Answer with a single digit: 0 if it
        contains no cancer, 1 if it contains cancer of any Gleason pattern (3, 4 or 5).
  primary:
    codes: [0, 3, 4, 5]
    paraphrases:
      - >-
        Which Gleason pattern occupies the largest share of the tumour in this core? Reply
        with one digit: 3, 4 or 5, or 0 if the core is benign.
      - >-
        Grade the dominant (most extensive) cancer pattern in this core with the Gleason
        system. Give a single digit: 0 for benign tissue, otherwise 3, 4 or 5.
  secondary:
    codes: [0, 3, 4, 5]
    paraphrases:
      - >-
        Which Gleason pattern occupies the second-largest share of the tumour in this core?
        If the tumour shows only one pattern, give that pattern again. Reply with one digit:
        3, 4 or 5, or 0 if the core is benign.
      - >-
        Grade the second most extensive cancer pattern in this core with the Gleason system;
        if there is just one pattern, report it again. Give a single digit: 0 for benign
        tissue, otherwise 3, 4 or 5.
  highest:
    codes: [0, 3, 4, 5]
    question: >-
      What is the highest Gleason pattern present anywhere in this core, even in a small
      area? Answer with a single digit: 0 if there is no cancer (benign), otherwise 3, 4 or 5.
    paraphrases:
      - >-
        What is the worst (most aggressive) Gleason pattern found anywhere in this core,
        however small its area? Reply with one digit: 3, 4 or 5, or 0 if the core is benign.
      - >-
        Grade the highest-grade cancer pattern visible in this core, even if it covers only a
        small region. Give a single digit: 0 for benign tissue, otherwise 3, 4 or 5.
  grade_group:
    codes: [0, 1, 2, 3, 4, 5]
    question: >-
      What is the ISUP grade group of this core, from its primary and secondary Gleason
      patterns (3+3 = 1, 3+4 = 2, 4+3 = 3, 4+4, 3+5 or 5+3 = 4, 4+5, 5+4 or 5+5 = 5)?
      Answer with a single digit: 0 if there is no cancer (benign), otherwise 1 to 5.
    paraphrases:
      - >-
        Assign the ISUP grade group to this core from its primary and secondary Gleason
        patterns (3+3 = 1, 3+4 = 2, 4+3 = 3, 4+4, 3+5 or 5+3 = 4, 4+5, 5+4 or 5+5 = 5).
        Reply with one digit from 1 to 5, or 0 if the core is benign.
      - >-
        Using ISUP grade groups (1 = 3+3, 2 = 3+4, 3 = 4+3, 4 = 4+4, 3+5 or 5+3, 5 = 4+5,
        5+4 or 5+5), which grade group does this core have? Give a single digit: 0 for
        benign tissue, otherwise 1 to 5.
query_swap: [primary, secondary, highest]   # same code set, so answers are comparable
